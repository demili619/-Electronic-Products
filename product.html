<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BK-9030 | BAKU Official</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        .container{max-width:1200px;margin:0 auto;padding:0 20px}
        header{background:#222;color:#fff;padding:20px 0}
        header .container{display:flex;justify-content:space-between;align-items:center}
        nav a{color:#fff;margin-left:20px;text-decoration:none;font-size:16px}
        nav a:hover{color:#007bff}
        .product-wrap{display:flex;flex-wrap:wrap;padding:60px 0;gap:40px;align-items:flex-start}
        .product-slider{flex:1;min-width:300px;position:relative;overflow:hidden;border-radius:10px}
        .slide-item{display:none;width:100%}
        .slide-item img{width:100%;border-radius:10px}
        .prev,.next{position:absolute;top:50%;transform:translateY(-50%);background:#00000066;color:white;padding:12px 16px;font-size:20px;border:none;cursor:pointer}
        .prev{left:10px}
        .next{right:10px}
        .product-info{flex:1;min-width:300px}
        .product-info h2{font-size:28px;margin-bottom:20px}
        .product-info p{font-size:16px;line-height:1.6;margin-bottom:20px;color:#333}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        td{border:1px solid #ddd;padding:12px;font-size:15px}
        .btn{display:inline-block;background:#007bff;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;margin-top:10px}
        footer{background:#222;color:#fff;text-align:center;padding:30px 0}
    </style>
</head>
<body>
<header>
    <div class="container">
        <h1>BAKU Official</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="why-choose-us.html">Why Choose Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>
<div class="container">
    <div class="product-wrap">
        <div class="product-slider">
            <div class="slide-item" style="display:block;"><img src="images/9030-1.jpg"></div>
            <div class="slide-item"><img src="images/9030-2.jpg"></div>
            <div class="slide-item"><img src="images/9030-3.jpg"></div>
            <div class="slide-item"><img src="images/9030-4.jpg"></div>
            <button class="prev" onclick="go(-1)">❮</button>
            <button class="next" onclick="go(1)">❯</button>
        </div>
        <div class="product-info">
            <h2>BK-9030 Ultrasonic Cleaner</h2>
            <p>0.8L portable mini ultrasonic cleaner for jewelry, glasses, watches and small parts.</p>
            <table>
                <tr><td>Model</td><td>BK-9030</td></tr>
                <tr><td>Capacity</td><td>0.8L</td></tr>
                <tr><td>Frequency</td><td>40KHz</td></tr>
                <tr><td>Tank</td><td>304 Stainless Steel</td></tr>
            </table>
            <a href="contact.html" class="btn">Inquire Now</a>
        </div>
    </div>
</div>
<footer><p>© 2026 BAKU | Global Supplier</p></footer>
<script>
let i=1;
function go(n){
    let s=document.getElementsByClassName("slide-item");
    i+=n;
    if(i>s.length)i=1;
    if(i<1)i=s.length;
    for(let x=0;x<s.length;x++)s[x].style.display="none";
    s[i-1].style.display="block";
}
</script>
</body>
</html>
